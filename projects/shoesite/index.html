<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIck Sole Shoe Store</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/x-icon" href="images/favicon.ico" />

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
   font-family: "Open Sans", sans-serif;
}

body {
    background: linear-gradient(to right, #f0f0f0, #888);
}

header {
    background-color: #111;
    color: white;
    display: flex;
    justify-content: space-between;
    padding: 20px 10%;
    align-items: center;
}

header h1 {
    color: #ff9800;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    transition: color 0.3s ;
}

nav a:hover {
    color: #eece1a;
}

.shoe{
    background: linear-gradient(to right, #111, #444);
    color:white;
    text-align: center;
    padding: 82px 20px;
}

.shoe h2 {
    font-size: 42px;
    margin-bottom: 20px;
}
.shoe p {
    font-size: 20px;
    margin-bottom: 30px;
}   
.shoe button {
    background-color: #ff9800;
    color: white;
    border: none;
    padding: 15px 27px;
    font-size: 18px;
    cursor: pointer;
    transition: background-color 0.3s ;
    font-size: 20px;
}
.shoe button:hover {
    background-color: #2c1f0c;
    color: #ffd000;
}
.products {
    width: 90%;
    margin: 40px auto;
}
.prodcuts h2 {
    text-align: center;
    margin-bottom: 30px;
}
.card-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}
.card {
    background-color: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    text-align: center;
    transition:transform 0.3s ;
}
.card:hover {
    transform: translateY(-10px);
}
.card img {
    width: 100%;
    height: 215px;
    object-fit: cover;
}
.card h3 {
    margin: 15px 0;
}
.card p.price {
    font-size: 25px;
    font-weight: bold;
    color: #ff9800;
}
.card button {
    background-color: #ff9800;
    color: white;
    border: none;
    padding: 10px 20px;
    margin-bottom: 15px;
    cursor: pointer;
    transition: background-color 0.3s ;
}
.card button:hover {
    background-color: #2c1f0c;
    color: #ffd000;
}
footer {
    background-color: #111;
    color: white;
    text-align: center;
    padding: 20px;
}

</style>

</head>
<body>

<header>
    <h1>Kick Sole  </h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="shoe">
    <h2>Step Into Comfort, Walk With Confidence</h2>
    <p>Find the best sneakers for every lifestyle.</p>
    <button>Shop Now</button>
</section>

<section class="products">

<h2>Featured Shoes</h2>

<div class="card-container">

<div class="card">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" alt="Running Shoe">
<h3>Running Shoe</h3>
<p class="price">$89</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1543508282-6319a3e2621f?w=600" alt="Classic Sneaker">
<h3>Classic Sneaker</h3>
<p class="price">$110</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=600" alt="Basketball Shoe">
<h3>Basketball Shoe</h3>
<p class="price">$130</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=600" alt="Casual Shoe">
<h3>Casual Shoe</h3>
<p class="price">$75</p>
<button>Add to Cart</button>
</div>

</div>

</section>

<footer>
<p>© 2026 Kick Sole Shoe Store | All Rights Reserved</p>
</footer>

</body>
</html>
