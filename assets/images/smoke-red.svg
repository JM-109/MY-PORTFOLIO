<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <filter id="billow" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.004" numOctaves="2" seed="77" result="warp"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="3" seed="13" result="t"/>
      <feDisplacementMap in="t" in2="warp" scale="140" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feColorMatrix in="d" type="matrix" values="0 0 0 0 0.44  0 0 0 0 0.07  0 0 0 0 0.07  0.33 0.33 0.33 0 0" result="g"/>
      <feComponentTransfer in="g"><feFuncA type="table" tableValues="0 0.06 0.48 0.9"/></feComponentTransfer>
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="wisp" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.003" numOctaves="2" seed="11" result="warp"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="5" seed="41" result="t"/>
      <feDisplacementMap in="t" in2="warp" scale="90" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feColorMatrix in="d" type="matrix" values="0 0 0 0 0.72  0 0 0 0 0.20  0 0 0 0 0.17  0.33 0.33 0.33 0 0" result="g"/>
      <feComponentTransfer in="g"><feFuncA type="table" tableValues="0 0.05 0.5 1"/></feComponentTransfer>
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>
  <rect width="600" height="600" filter="url(#billow)"/>
  <rect width="600" height="600" filter="url(#wisp)"/>
</svg>
